<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — EarnFlow</title><link rel="stylesheet" href="style.css"></head><body><div class="auth"><div class="brand">Earn<span>Flow</span></div><h1>অ্যাকাউন্ট তৈরি করুন</h1><div class="panel"><div class="field"><label>নাম</label><input id="name" placeholder="আপনার নাম"></div><div class="field"><label>মোবাইল / Email</label><input id="contact" placeholder="আপনার যোগাযোগ"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="Password"></div><button class="btn full" onclick="register()">Create Account</button><p style="text-align:center">Already registered? <a href="login.html">Login</a></p></div></div><script>function register(){localStorage.setItem('user',JSON.stringify({name:document.getElementById('name').value||'Demo User',balance:0}));location.href='dashboard.html'}</script></body></html>
